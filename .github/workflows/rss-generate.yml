name: RSSフィード自動生成

on:
  schedule:
    # 中国時間の毎週金曜14時 = UTC 6時 (中国時間=UTC+8)
    - cron: '0 6 * * 5'
  # 手動実行も可能にする
  workflow_dispatch:

# 権限設定（重要）
permissions:
  contents: write
  pages: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      # 1. リポジトリをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # トークンを明示的に指定（必要に応じて）
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Pythonをセットアップ
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. 依存ライブラリをインストール
      - name: 依存ライブラリをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. RSSフィードを生成
      - name: RSSフィードを生成
        run: |
          python generate_rss.py
      
      # 5. 生成されたフィードをコミット・プッシュ
      - name: 変更をコミット・プッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gitの設定
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 変更があるか確認
          if git diff --quiet feed.xml; then
            echo "変更はありません"
          else
            # 変更をコミット
            git add feed.xml
            git commit -m "自動更新: RSSフィードを更新 ($(date '+%Y-%m-%d %H:%M:%S UTC'))"
            
            # プッシュ（リモートURLにトークンを含める）
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main
            echo "RSSフィードを更新しました"
          fi
