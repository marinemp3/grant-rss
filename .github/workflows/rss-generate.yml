name: RSSフィード自動生成

on:
  schedule:
    # 中国時間の毎週金曜14時 = UTC 6時
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 依存ライブラリをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: RSSフィードを生成
        run: |
          python generate_rss.py
          # feed.xmlが存在するか確認
          ls -la feed.xml || echo "feed.xmlが生成されていません"
      
      - name: 変更をコミット・プッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gitの設定
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 現在のブランチを取得
          CURRENT_BRANCH=$(git branch --show-current)
          echo "現在のブランチ: $CURRENT_BRANCH"
          
          # feed.xmlが存在するか確認
          if [ ! -f "feed.xml" ]; then
            echo "エラー: feed.xmlが存在しません"
            exit 1
          fi
          
          # feed.xmlが.gitignoreに含まれているか確認
          if grep -q "^feed.xml$" .gitignore 2>/dev/null; then
            echo "警告: feed.xmlが.gitignoreに含まれています。強制的に追加します。"
            git add -f feed.xml
          else
            git add feed.xml
          fi
          
          # 変更があるか確認
          if git diff --staged --quiet; then
            echo "変更はありません（feed.xmlに差分なし）"
          else
            # 変更をコミット
            git commit -m "自動更新: RSSフィードを更新 ($(date '+%Y-%m-%d %H:%M:%S UTC'))"
            
            # プッシュ（現在のブランチにプッシュ）
            git push origin HEAD:$CURRENT_BRANCH
            echo "RSSフィードを更新しました"
          fi
